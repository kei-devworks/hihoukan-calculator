name: Check analytics relay against blocklists

# 閲覧数の中継が、広告ブロッカーの一覧に止められていないかを毎週確かめる（docs/deployment.md の「閲覧数の計測」）。
# 一覧はサイトの変更と関係なく更新されるので、デプロイとは別に流す。落ちたら持ち主にメールが届く
on:
  schedule:
    - cron: '23 0 * * 1' # 毎週月曜 9:23（日本時間）
  workflow_dispatch:

jobs:
  check:
    name: Blocklists
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the relay is not blocked
        run: npm run check:blocklists
